name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/api/requirements*.txt
      - name: Install API and development dependencies
        run: python -m pip install -r app/api/requirements-dev.txt
      - name: Lint API
        run: ruff check app/api/shop_api app/api/tests scripts/tests
      - name: Test API
        run: pytest -q app/api/tests
      - name: Check Compose configuration
        run: docker compose config --quiet
      - name: Run local integration smoke test
        run: |
          docker compose up --build --detach
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:8081/readyz >/dev/null; then
              break
            fi
            sleep 3
          done
          curl --fail --silent --show-error http://localhost:8081/api/products |
            python -c "import json,sys; assert len(json.load(sys.stdin)) == 3"
          curl --fail --silent --show-error -X PUT http://localhost:8081/api/cart \
            -H 'Content-Type: application/json' \
            -d '{"items":[{"product_id":1,"quantity":2}]}' |
            python -c "import json,sys; assert json.load(sys.stdin)['items'][0]['quantity'] == 2"
          curl --fail --silent --show-error http://localhost:8081/api/cart |
            python -c "import json,sys; assert json.load(sys.stdin)['items'][0]['product_id'] == 1"
      - name: Stop local integration services
        if: always()
        run: docker compose down --volumes --remove-orphans
      - name: Check shell scripts
        run: |
          shellcheck -x -P scripts scripts/*.sh scripts/lib/common.sh
          for script in scripts/*.sh; do bash -n "$script"; done
      - name: Test deployment scripts without Azure access
        run: python -m unittest discover -s scripts/tests -v
      - name: Compile Azure infrastructure Bicep
        run: |
          az bicep install
          az bicep build --file infra/azure/main.bicep --outfile /tmp/adaptive-shop-infra.json
          az bicep build --file radius/app.bicep --outfile /tmp/adaptive-shop-app.json
          az bicep build --file radius/environments/aro.bicep --outfile /tmp/adaptive-shop-aro.json
          az bicep build --file radius/environments/onprem.bicep --outfile /tmp/adaptive-shop-onprem.json
          az bicep build --file radius/recipe-packs/aro.bicep --outfile /tmp/adaptive-shop-aro-recipes.json
          az bicep build --file radius/recipe-packs/onprem.bicep --outfile /tmp/adaptive-shop-onprem-recipes.json
      - name: Validate YAML files
        run: |
          python -m pip install pyyaml
          python - <<'PY'
          from pathlib import Path
          import yaml

          files = [
              *Path("dapr").rglob("*.yaml"),
              *Path("infra").rglob("*.yaml"),
              *Path("chaos").rglob("*.yaml"),
              *Path(".github/workflows").rglob("*.yml"),
          ]
          for path in files:
              list(yaml.safe_load_all(path.read_text()))
          print(f"Validated {len(files)} YAML files")
          PY

  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $parseErrors = @()
          Get-ChildItem scripts -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref]$tokens, [ref]$errors)
            $parseErrors += $errors
          }
          if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
      - name: Test Windows workflows without Azure access
        shell: pwsh
        run: python -m unittest discover -s scripts/tests -p test_powershell.py -v

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [app, powershell]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build and publish API
        uses: docker/build-push-action@v6
        with:
          context: ./app/api
          file: ./app/api/Containerfile
          push: true
          tags: ghcr.io/joranbergfeld/adaptive-app-example/shop-api:${{ github.sha }}
      - name: Build and publish storefront
        uses: docker/build-push-action@v6
        with:
          context: ./app/web
          file: ./app/web/Containerfile
          push: true
          tags: ghcr.io/joranbergfeld/adaptive-app-example/shop-web:${{ github.sha }}
