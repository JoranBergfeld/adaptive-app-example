apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: statestore
spec:
  type: state.redis
  version: v1
  metadata:
    - name: redisHost
      value: __REDIS_HOST__
    - name: enableTLS
      value: "true"
    - name: redisPassword
      secretKeyRef:
        name: shop-redis-password
        key: shop-redis-password
  auth:
    secretStore: secretstore
