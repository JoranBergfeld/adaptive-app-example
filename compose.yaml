services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shop-local-only}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./app/api/init.sql:/docker-entrypoint-initdb.d/00-shop.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d shop"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4.2-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  secret-init:
    build:
      context: ./app/api
      dockerfile: Containerfile
    user: "0"
    entrypoint: ["python", "-c"]
    command:
      - "import json, os; open('/local-secrets/secrets.json', 'w').write(json.dumps({'shop-db-password': os.environ['POSTGRES_PASSWORD']}))"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shop-local-only}
    volumes:
      - local-secrets:/local-secrets
    restart: "no"

  daprd:
    image: daprio/daprd:1.19.0
    command:
      - ./daprd
      - --app-id
      - shop-api
      - --dapr-http-port
      - "3500"
      - --resources-path
      - /components
    volumes:
      - ./dapr/components/local:/components:ro
      - local-secrets:/local-secrets:ro
    depends_on:
      redis:
        condition: service_healthy
      secret-init:
        condition: service_completed_successfully

  api:
    build:
      context: ./app/api
      dockerfile: Containerfile
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: shop
      DATABASE_USER: shop
      DATABASE_SSLMODE: disable
      DATABASE_PASSWORD_SECRET_NAME: shop-db-password
      DATABASE_PASSWORD_SECRET_KEY: shop-db-password
      DAPR_HTTP_ENDPOINT: http://daprd:3500
      DAPR_STATE_STORE: statestore
      DAPR_SECRET_STORE: secretstore
      SHOP_ENVIRONMENT: local
      SHOP_CLUSTER_NAME: docker-compose
      SHOP_PLATFORM: local
      DATABASE_SERVICE_NAME: PostgreSQL container
      CACHE_SERVICE_NAME: Redis container via Dapr
      SECRETS_SERVICE_NAME: local development environment
      IMAGE_REGISTRY: local Docker build
      CORS_ALLOWED_ORIGINS: http://localhost:8081
    ports:
      - "8000:8080"
    depends_on:
      postgres:
        condition: service_healthy
      daprd:
        condition: service_started

  web:
    build:
      context: ./app/web
      dockerfile: Containerfile
    environment:
      SHOP_API_BASE_URL: ""
      SHOP_API_ORIGIN: http://api:8080
    ports:
      - "8081:8080"
    depends_on:
      - api

volumes:
  postgres-data:
  local-secrets:
